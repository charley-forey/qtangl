# Local full stack: Postgres + Redis + API + worker (Monitor tier).
# Web frontend still runs on the host: cd web && npm run dev
#
# Usage:
#   docker compose up --build
#   curl http://127.0.0.1:8000/health
#
# See docs/DEVELOPMENT.md for env overrides and troubleshooting.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: qtangl
      POSTGRES_PASSWORD: qtangl
      POSTGRES_DB: qtangl
    ports:
      - "5432:5432"
    volumes:
      - qtangl_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qtangl -d qtangl"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    command: >
      sh -c "python -m alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    environment:
      DATABASE_URL: postgresql+psycopg://qtangl:qtangl@postgres:5432/qtangl
      REDIS_URL: redis://redis:6379/0
      QTANGL_API_KEY: qtangl-demo-key
      QTANGL_ADMIN_API_KEY: qtangl-admin-dev-key
      QTANGL_INLINE_JOBS: "false"
      QTANGL_ENABLE_QAOA: "false"
      QTANGL_CORS_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
      QTANGL_PUBLIC_URL: http://localhost:3000
      QTANGL_ENABLE_SCHEDULER: "false"
    ports:
      - "8000:8000"
    volumes:
      - ./backend/app:/app/app:ro
      - ./backend/alembic:/app/alembic:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    command: python -m app.worker
    environment:
      DATABASE_URL: postgresql+psycopg://qtangl:qtangl@postgres:5432/qtangl
      REDIS_URL: redis://redis:6379/0
      QTANGL_API_KEY: qtangl-demo-key
      QTANGL_INLINE_JOBS: "false"
      QTANGL_ENABLE_SCHEDULER: "true"
      QTANGL_ENABLE_QAOA: "false"
      QTANGL_SCHEDULER_INTERVAL_SEC: "60"
    volumes:
      - ./backend/app:/app/app:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_started

volumes:
  qtangl_pgdata:
