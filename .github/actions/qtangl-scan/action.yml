name: Qtangl PQC Scan
description: Run Qtangl post-quantum readiness scan in CI
inputs:
  api-key:
    description: Tenant API key
    required: true
  target:
    description: Target domain or host
    required: true
  api-url:
    description: Qtangl API base URL
    default: https://api.qtangl.com
  fail-on-new-quantum-vulnerable:
    description: Fail job when scan diff reports new quantum-vulnerable assets
    required: false
    default: "false"
  baseline-scan-id:
    description: Optional prior scan ID to compare readiness delta against
    required: false
    default: ""
  mode:
    description: "Scan mode: external, code, or binary"
    required: false
    default: "external"
  github-owner:
    description: GitHub owner (code mode)
    required: false
    default: ""
  github-repo:
    description: GitHub repo (code mode)
    required: false
    default: ""
  image-ref:
    description: Container image ref (binary mode)
    required: false
    default: ""
  sarif-output:
    description: Path to write SARIF results (code/binary modes)
    required: false
    default: ""
  use-fixture:
    description: "External scan mode: true for fixture, false for live production scan"
    required: false
    default: "false"
  poll-timeout-sec:
    description: Max seconds to poll async live scans
    required: false
    default: "600"
  poll-interval-sec:
    description: Seconds between poll attempts
    required: false
    default: "10"
outputs:
  scan-id:
    description: Completed scan ID (external mode)
    value: ${{ steps.run-scan.outputs.scan-id }}
runs:
  using: composite
  steps:
    - name: Run scan
      id: run-scan
      shell: bash
      env:
        QTANGL_API_KEY: ${{ inputs.api-key }}
        QTANGL_API_URL: ${{ inputs.api-url }}
        QTANGL_TARGET: ${{ inputs.target }}
        FAIL_REGRESSION: ${{ inputs.fail-on-new-quantum-vulnerable }}
        BASELINE_SCAN_ID: ${{ inputs.baseline-scan-id }}
        QTANGL_MODE: ${{ inputs.mode }}
        GITHUB_OWNER: ${{ inputs.github-owner }}
        GITHUB_REPO: ${{ inputs.github-repo }}
        IMAGE_REF: ${{ inputs.image-ref }}
        SARIF_OUTPUT: ${{ inputs.sarif-output }}
        USE_FIXTURE: ${{ inputs.use-fixture }}
        POLL_TIMEOUT_SEC: ${{ inputs.poll-timeout-sec }}
        POLL_INTERVAL_SEC: ${{ inputs.poll-interval-sec }}
      run: |
        python3 << 'PY'
        import json, os, sys, time, urllib.request
        mode = os.environ.get("QTANGL_MODE", "external")
        base = os.environ["QTANGL_API_URL"].rstrip("/")
        headers = {"Authorization": "Bearer " + os.environ["QTANGL_API_KEY"], "Content-Type": "application/json"}
        use_fixture = os.environ.get("USE_FIXTURE", "false").lower() in ("1", "true", "yes")
        poll_timeout = int(os.environ.get("POLL_TIMEOUT_SEC", "600"))
        poll_interval = int(os.environ.get("POLL_INTERVAL_SEC", "10"))
        if mode == "code":
          body = json.dumps({
            "githubOwner": os.environ.get("GITHUB_OWNER", ""),
            "githubRepo": os.environ.get("GITHUB_REPO", ""),
            "githubToken": os.environ.get("GITHUB_TOKEN", os.environ["QTANGL_API_KEY"]),
            "async": False,
          }).encode()
          path = "/tenant/coverage/code-scan"
        elif mode == "binary":
          body = json.dumps({"imageRef": os.environ.get("IMAGE_REF", ""), "async": True}).encode()
          path = "/tenant/discovery/binary-scan"
        else:
          target = os.environ["QTANGL_TARGET"]
          body = json.dumps({
            "target": target,
            "scenarioId": "bank-tls-inventory",
            "useFixture": use_fixture,
            "depth": "standard",
          }).encode()
          path = "/pqc/scan"
        req = urllib.request.Request(
          base + path,
          data=body,
          headers=headers,
          method="POST",
        )
        with urllib.request.urlopen(req, timeout=120) as r:
          out = json.loads(r.read().decode())
        scan_id = out.get("scanId")
        if mode == "external" and not use_fixture and out.get("status") == "running" and scan_id:
          deadline = time.time() + poll_timeout
          while time.time() < deadline:
            poll_req = urllib.request.Request(
              base + f"/pqc/scan/{scan_id}",
              headers=headers,
              method="GET",
            )
            with urllib.request.urlopen(poll_req, timeout=60) as pr:
              polled = json.loads(pr.read().decode())
            status = polled.get("status")
            if status in ("success", "done"):
              out = polled
              break
            if status == "error":
              print(f"::error::Scan failed: {polled.get('detail') or polled}")
              sys.exit(1)
            time.sleep(poll_interval)
          else:
            print(f"::error::Scan {scan_id} did not complete within {poll_timeout}s")
            sys.exit(1)
        scan_id = out.get("scanId") or scan_id
        print(json.dumps(out, indent=2))
        if scan_id:
          print(f"::notice::scanId={scan_id}")
          github_output = os.environ.get("GITHUB_OUTPUT")
          if github_output:
            with open(github_output, "a", encoding="utf-8") as gh_out:
              gh_out.write(f"scan-id={scan_id}\n")
        sarif_path = os.environ.get("SARIF_OUTPUT", "").strip()
        if sarif_path and mode in ("code", "binary"):
          findings = out.get("findings") or (out.get("result") or {}).get("findings") or []
          runs = [{
            "tool": {"driver": {"name": "qtangl-discovery", "version": "0.1.0"}},
            "results": [
              {
                "ruleId": "quantum-vulnerable-crypto",
                "message": {"text": str(f.get("algorithm", "unknown"))},
                "locations": [{"physicalLocation": {"artifactLocation": {"uri": str(f.get("location", "."))}}}],
              }
              for f in findings if isinstance(f, dict)
            ],
          }]
          sarif = {"version": "2.1.0", "$schema": "https://json.schemastore.org/sarif-2.1.0.json", "runs": runs}
          with open(sarif_path, "w", encoding="utf-8") as sf:
            json.dump(sarif, sf, indent=2)
          print(f"Wrote SARIF to {sarif_path}")
        if sarif_path and os.environ.get("GITHUB_ACTIONS") == "true" and mode in ("code", "binary"):
          print(f"::notice::Upload {sarif_path} with github/codeql-action/upload-sarif@v3")
        report = out.get("report") or {}
        diff = report.get("scanDiff") or out.get("scanDiff")
        baseline = os.environ.get("BASELINE_SCAN_ID", "").strip()
        if baseline and not diff:
          base_req = urllib.request.Request(
            os.environ["QTANGL_API_URL"].rstrip("/") + f"/tenant/scans/{baseline}",
            headers={"Authorization": "Bearer " + os.environ["QTANGL_API_KEY"]},
          )
          try:
            with urllib.request.urlopen(base_req, timeout=60) as br:
              base_out = json.loads(br.read().decode())
              base_score = float((base_out.get("report") or {}).get("readinessScore") or 0)
              cur_score = float(report.get("readinessScore") or 0)
              if cur_score < base_score - 5:
                print(f"::error::Readiness dropped {base_score - cur_score:.1f} vs baseline {baseline}")
                sys.exit(1)
          except Exception as exc:
            print(f"::warning::Could not load baseline scan: {exc}")
        if os.environ.get("FAIL_REGRESSION", "").lower() in ("1", "true", "yes") and diff:
          n = int(diff.get("newQuantumVulnerableCount") or 0)
          if n > 0:
            print(f"::error::Found {n} new quantum-vulnerable asset(s)")
            sys.exit(1)
        PY
