name: Staging smoke

on:
  schedule:
    - cron: "0 16 * * 1-5"
  workflow_dispatch:
    inputs:
      api_base:
        description: "Staging API base URL"
        required: false
        default: ""

jobs:
  conversion-smoke:
    name: GTM conversion smoke
    runs-on: ubuntu-latest
    continue-on-error: true
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Run conversion smoke
        env:
          QTANGL_API_BASE: ${{ github.event.inputs.api_base || secrets.QTANGL_STAGING_API_BASE || 'https://api.qtangl.com' }}
        run: python scripts/conversion_smoke.py

  assess-web-smoke:
    name: Assess web smoke
    runs-on: ubuntu-latest
    continue-on-error: true
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Assess page + redirects
        env:
          QTANGL_WEB_BASE: https://www.qtangl.com
        run: python scripts/assess_web_smoke.py

  sdk-smoke:
    name: SDK integration smoke
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install SDK
        run: |
          pip install -e verifier
          pip install -e ../sdk/python

      - name: Run SDK smoke
        env:
          QTANGL_API_BASE: ${{ github.event.inputs.api_base || secrets.QTANGL_STAGING_API_BASE || 'https://api.qtangl.com' }}
          QTANGL_API_KEY: ${{ secrets.QTANGL_STAGING_API_KEY || 'qtangl-demo-key' }}
        run: python scripts/sdk_smoke.py
