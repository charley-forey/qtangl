name: PQC dogfood scan

on:
  schedule:
    - cron: "0 14 * * *"
    - cron: "0 15 * * 1"
  workflow_dispatch:
    inputs:
      live:
        description: Run live-dogfood job (requires QTANGL_DOGFOOD_API_KEY)
        type: boolean
        default: false
      fixture:
        description: Run fixture-regression job (BM-006 local smoke)
        type: boolean
        default: true

jobs:
  live-dogfood:
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.live)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [www.qtangl.com, qtangl.com, api.qtangl.com]
    steps:
      - uses: actions/checkout@v7

      - name: Live scan ${{ matrix.target }}
        id: scan
        uses: ./.github/actions/qtangl-scan
        with:
          api-key: ${{ secrets.QTANGL_DOGFOOD_API_KEY }}
          api-url: ${{ secrets.QTANGL_PROD_API_BASE || 'https://api.qtangl.com' }}
          target: ${{ matrix.target }}
          use-fixture: "false"
          fail-on-new-quantum-vulnerable: "true"

      - name: Verify signature and transparency log
        env:
          QTANGL_API_BASE: ${{ secrets.QTANGL_PROD_API_BASE || 'https://api.qtangl.com' }}
          SCAN_ID: ${{ steps.scan.outputs.scan-id }}
        run: |
          python3 << 'PY'
          import json, os, sys, urllib.request
          base = os.environ["QTANGL_API_BASE"].rstrip("/")
          scan_id = os.environ.get("SCAN_ID", "").strip()
          if not scan_id:
              print("::error::Scan step did not return scan-id")
              sys.exit(1)
          verify = json.loads(urllib.request.urlopen(f"{base}/pqc/verify/{scan_id}", timeout=60).read().decode())
          verification = verify.get("verification") or {}
          if not verification.get("valid"):
              print(f"::error::Verify invalid for {scan_id}")
              sys.exit(1)
          inclusion = verification.get("logInclusion") or {}
          if not inclusion.get("included"):
              print(f"::warning::Transparency log inclusion absent for {scan_id}")
          with open(f"dogfood-{scan_id}.json", "w", encoding="utf-8") as fh:
              json.dump(verify, fh, indent=2)
          print(f"Live dogfood OK: {scan_id}")
          PY

      - name: Upload live dogfood artifact
        uses: actions/upload-artifact@v7
        with:
          name: live-dogfood-${{ matrix.target }}
          path: dogfood-*.json
          if-no-files-found: ignore

  fixture-regression:
    if: github.event.schedule == '0 15 * * 1' || (github.event_name == 'workflow_dispatch' && inputs.fixture)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            backend/requirements.lock
            backend/requirements-dev.lock

      - name: Install backend deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock -r requirements-dev.lock

      - name: Fixture PQC scan (BM-006 regression — not production domains)
        run: python benchmarks/run_benchmark.py BM-006 --write

      - name: Upload scan artifact
        uses: actions/upload-artifact@v7
        with:
          name: pqc-dogfood-bm-006
          path: backend/benchmarks/results/BM-006-pqc-scan.json

      - name: Sign + verify + transparency smoke (local SQLite)
        env:
          QTANGL_ENABLE_TRANSPARENCY_LOG: "true"
          DATABASE_URL: sqlite:///./dogfood_evidence.db
        run: |
          alembic upgrade head
          python - <<'PY'
          import json
          from pathlib import Path

          from app.pqc.data import load_dataset
          from app.pqc.pipeline import run_pqc_scan
          from app.pqc.report import report_to_json
          from app.pqc.signing import sign_report_payload, verify_report_signature
          from app.pqc.transparency import log_inclusion_block, safe_append_after_sign

          dataset = load_dataset()
          bundle = run_pqc_scan(dataset, scenario_id="bank-tls-inventory", use_fixture=True)
          report = report_to_json(bundle.report)
          verify_payload = {k: v for k, v in report.items() if k != "signature"}
          sig = sign_report_payload(verify_payload)
          safe_append_after_sign(verify_payload, sig, tenant_id="dogfood")
          result = verify_report_signature(verify_payload, sig)
          inclusion = log_inclusion_block(sig["contentHash"])
          assert result.get("valid"), result
          assert inclusion and inclusion.get("included"), inclusion
          Path("benchmarks/results/dogfood-verify-fixture.json").write_text(
              json.dumps(
                  {
                      "valid": True,
                      "logIncluded": True,
                      "seq": inclusion.get("seq"),
                      "scanId": bundle.scan_id,
                  },
                  indent=2,
              ),
              encoding="utf-8",
          )
          print(f"fixture verify + log inclusion OK scanId={bundle.scan_id}")
          PY

      - name: Upload fixture verify artifact
        uses: actions/upload-artifact@v7
        with:
          name: pqc-dogfood-fixture-verify
          path: backend/benchmarks/results/dogfood-verify-fixture.json
