name: Supply chain sign

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  id-token: write
  contents: read
  packages: write

jobs:
  cosign:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Build backend image (local)
        run: docker build -t qtangl-api:ci backend

      - name: Sign image (keyless when OIDC configured)
        run: |
          cosign sign --yes qtangl-api:ci || echo "WARN: cosign sign skipped — configure Sigstore OIDC for production"

      - name: Build qtangl-verify wheel
        working-directory: backend/verifier
        run: |
          python -m pip install build
          python -m build

      - name: Sign wheel artifact
        working-directory: backend/verifier
        run: |
          cosign sign-blob --yes dist/*.whl --output-signature dist/wheel.sig || echo "WARN: wheel sign skipped"
