name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            backend/requirements.lock
            backend/requirements-dev.lock

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock -r requirements-dev.lock

      - name: Alembic upgrade (dry-run)
        env:
          DATABASE_URL: sqlite:///./ci_alembic.db
        run: |
          alembic upgrade head
          alembic check || true

      - name: Verify scanner-versions.lock
        run: python scripts/verify_scanner_versions.py

      - name: Run tests
        env:
          QTANGL_ENABLE_QAOA: "false"
          QTANGL_ENABLE_TRANSPARENCY_LOG: "true"
          DATABASE_URL: sqlite:///./ci_test.db
        run: python -m pytest tests/ -q --tb=short

      - name: Export OpenAPI artifact
        run: python scripts/export_openapi.py

      - name: Offline verify CLI smoke
        env:
          QTANGL_ENABLE_TRANSPARENCY_LOG: "true"
          DATABASE_URL: sqlite:///./ci_test.db
        run: |
          python -m pytest tests/test_pqc_golden.py -q --tb=short
          python scripts/qtangl_verify.py --help

  backend-mldsa:
    name: Backend (ML-DSA optional)
    runs-on: ubuntu-latest
    continue-on-error: true
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            backend/requirements.lock
            backend/requirements-dev.lock

      - name: Install liboqs system deps
        run: sudo apt-get update && sudo apt-get install -y liboqs-dev cmake build-essential

      - name: Install dependencies + oqs-python
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock -r requirements-dev.lock
          pip install oqs-python || echo "oqs-python install skipped"

      - name: ML-DSA sign/verify smoke
        env:
          QTANGL_ENABLE_QAOA: "false"
        run: |
          python -m pytest tests/test_signing_dual.py -q --tb=short || true
          python -c "
          try:
              from app.pqc.signing import sign_report_payload, verify_report_signature
              p={'scanId':'mldsa-ci','readinessScore':1}
              s=sign_report_payload(p)
              r=verify_report_signature(p,s)
              print('alg', s.get('alg'), 'valid', r.get('valid'))
              assert s.get('alg')=='ML-DSA-65' or s.get('alg')=='Ed25519'
          except Exception as e:
              print('ML-DSA CI skipped:', e)
          "

      - name: Dependency audit (pip-audit)
        run: pip install pip-audit && pip-audit -r requirements.lock || true

  web:
    name: Web (lint + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Readiness content link check
        run: npm run check:readiness-content

      - name: Docs coverage gate
        run: node scripts/check_docs_coverage.mjs

      - name: Schema sync check
        run: node scripts/check_schema_sync.mjs

      - name: Build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
        run: npm run build

      - name: Install Playwright
        run: npx playwright install chromium --with-deps

      - name: E2E smoke (access)
        env:
          QTANGL_API_BASE_URL: http://127.0.0.1:8000
        run: npx playwright test tests/e2e/access.spec.ts

      - name: E2E HNDL hub
        env:
          QTANGL_API_BASE_URL: http://127.0.0.1:8000
        run: npx playwright test tests/e2e/hndl.spec.ts

      - name: E2E dashboard (if spec exists)
        if: hashFiles('web/tests/e2e/dashboard.spec.ts') != ''
        env:
          QTANGL_API_BASE_URL: http://127.0.0.1:8000
        run: npx playwright test tests/e2e/dashboard.spec.ts

      - name: E2E mobile responsive
        env:
          QTANGL_API_BASE_URL: http://127.0.0.1:8000
        run: npx playwright test tests/e2e/mobile-responsive.spec.ts --project=mobile-iphone-14

      - name: E2E mobile accessibility
        env:
          QTANGL_API_BASE_URL: http://127.0.0.1:8000
        run: npx playwright test tests/e2e/a11y-mobile.spec.ts --project=mobile-iphone-14

  lighthouse:
    name: Web (Lighthouse mobile)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
        run: npm run build

      - name: Run Lighthouse CI
        run: npx @lhci/cli@0.14.0 autorun

  codeql:
    name: CodeQL (Python + JavaScript)
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: python, javascript-typescript
      - uses: github/codeql-action/analyze@v3

  gitleaks:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml

  alignment:
    name: Marketing alignment gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Verify tier liveToday vs coverage matrix
        run: node scripts/alignment-check.mjs

  benchmarks:
    name: Benchmarks (BM-001, BM-003, BM-006)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            backend/requirements.lock
            backend/requirements-dev.lock

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock -r requirements-dev.lock

      - name: Run benchmark regression tests
        env:
          QTANGL_ENABLE_QAOA: "true"
        run: python -m pytest tests/test_benchmark_regression.py -q --tb=short
