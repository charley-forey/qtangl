[project]
name = "qtangl-verify"
version = "1.1.0"
description = "Offline Qtangl report verifier"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
authors = [{ name = "Qtangl" }]
dependencies = ["cryptography>=42.0.0"]

[project.scripts]
qtangl-verify = "qtangl_verify.cli:main"

[project.optional-dependencies]
pqc = ["oqs-python"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["qtangl_verify*"]
