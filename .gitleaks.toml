# Gitleaks configuration — docs may contain placeholder auth examples.
# Real secrets must never be committed; see roadmap/security/secrets-runbook.md

title = "Qtangl gitleaks config"

[allowlist]
description = "Documentation placeholders and vendored API reference examples"
paths = [
  '''(?i)cursor_agents_api\.md$''',
  '''web/app/docs/authentication/page\.tsx$''',
  '''backend/tests/test_anchor_git\.py$''',
]
regexes = [
  '''YOUR_API_KEY''',
  '''\$CURSOR_API_KEY:''',
  '''eyJjcmVhdGVkQXRNcyI6MTczNzMwNjg4MDAwMH0=''',
]
