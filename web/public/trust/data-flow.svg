<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 220" role="img" aria-label="Qtangl data flow">
  <defs>
    <style>
      .box { fill: #111; stroke: #444; stroke-width: 1.5; rx: 8; }
      .label { fill: #eee; font: 13px sans-serif; }
      .arrow { stroke: #888; stroke-width: 1.5; fill: none; marker-end: url(#arrowhead); }
    </style>
    <marker id="arrowhead" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#888"/>
    </marker>
  </defs>
  <rect class="box" x="10" y="80" width="110" height="50"/>
  <text class="label" x="65" y="110" text-anchor="middle">Tenant client</text>
  <rect class="box" x="150" y="80" width="90" height="50"/>
  <text class="label" x="195" y="110" text-anchor="middle">Qtangl API</text>
  <rect class="box" x="270" y="80" width="80" height="50"/>
  <text class="label" x="310" y="110" text-anchor="middle">Redis</text>
  <rect class="box" x="380" y="80" width="90" height="50"/>
  <text class="label" x="425" y="110" text-anchor="middle">Worker</text>
  <rect class="box" x="500" y="30" width="100" height="40"/>
  <text class="label" x="550" y="55" text-anchor="middle">Targets</text>
  <rect class="box" x="500" y="130" width="110" height="40"/>
  <text class="label" x="555" y="155" text-anchor="middle">Postgres</text>
  <rect class="box" x="640" y="80" width="80" height="50"/>
  <text class="label" x="680" y="110" text-anchor="middle">Signer</text>
  <rect class="box" x="740" y="80" width="70" height="50"/>
  <text class="label" x="775" y="110" text-anchor="middle">Log</text>
  <line class="arrow" x1="120" y1="105" x2="150" y2="105"/>
  <line class="arrow" x1="240" y1="105" x2="270" y2="105"/>
  <line class="arrow" x1="350" y1="105" x2="380" y2="105"/>
  <line class="arrow" x1="470" y1="95" x2="500" y2="55"/>
  <line class="arrow" x1="470" y1="115" x2="500" y2="150"/>
  <line class="arrow" x1="470" y1="105" x2="640" y2="105"/>
  <line class="arrow" x1="720" y1="105" x2="740" y2="105"/>
</svg>
